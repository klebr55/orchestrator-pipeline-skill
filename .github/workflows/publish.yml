name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - "bin/**"
      - "lib/**"
      - "skills/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm pack --dry-run

      - name: Check whether this version is already published
        id: version
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          published_version="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"

          if [ "${published_version}" = "${package_version}" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::Behavioral changes require a new package version before publishing."
              exit 1
            fi
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "${package_name}@${package_version} is already published; skipping manual publish."
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "Publishing ${package_name}@${package_version}."
          fi

      - name: Publish to npm with trusted publishing
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public

      - name: Record npm publication result
        if: always()
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" > npm-publication.txt
          printf '%s\n' "$(node -p "require('./package.json').version")" >> npm-publication.txt
          printf '%s\n' "${{ steps.version.outputs.publish }}" >> npm-publication.txt

      - name: Upload publication proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-publication-${{ github.run_id }}
          path: npm-publication.txt
          if-no-files-found: error
