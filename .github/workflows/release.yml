name: Create GitHub release

on:
  workflow_run:
    workflows:
      - Publish to npm
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Published npm version, for example 1.0.2"
        required: true
        type: string
      commit_sha:
        description: "40-character commit SHA that produced this npm version"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release-after-publish:
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Download npm publication proof
        uses: actions/download-artifact@v4
        with:
          name: npm-publication-${{ github.event.workflow_run.id }}
          path: publication-proof
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check out the published commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Validate publication and release source
        id: release
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "${HEAD_SHA}" != ""
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]

          proof_sha="$(sed -n '1p' publication-proof/npm-publication.txt)"
          proof_version="$(sed -n '2p' publication-proof/npm-publication.txt)"
          proof_published="$(sed -n '3p' publication-proof/npm-publication.txt)"
          test "${proof_sha}" = "${HEAD_SHA}"

          if [ "${proof_published}" != "true" ]; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
            echo "The npm workflow completed without publishing a new version; no release will be created."
            exit 0
          fi

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          test "${package_name}" = "@klebr55/orchestrator-pipeline-skill"
          [[ "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          test "${proof_version}" = "${package_version}"

          published_version="$(npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org 2>/dev/null)"
          test "${published_version}" = "${package_version}"

          echo "published=true" >> "${GITHUB_OUTPUT}"
          echo "tag=v${package_version}" >> "${GITHUB_OUTPUT}"

      - name: Read commit description
        if: steps.release.outputs.published == 'true'
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git log -1 --format=%B "${HEAD_SHA}" > release-notes.md

      - name: Skip an existing release
        if: steps.release.outputs.published == 'true'
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create release from commit description
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${HEAD_SHA}" \
            --title "${TAG}" \
            --notes-file release-notes.md

  release-manually:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual release request
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.commit_sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "klebr55/orchestrator-pipeline-skill"
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${REQUESTED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]

      - name: Check out the published commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify the published npm version
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          test "${package_name}" = "@klebr55/orchestrator-pipeline-skill"
          test "${package_version}" = "${REQUESTED_VERSION}"

          published_version="$(npm view "${package_name}@${REQUESTED_VERSION}" version --registry=https://registry.npmjs.org 2>/dev/null)"
          test "${published_version}" = "${REQUESTED_VERSION}"

          echo "tag=v${REQUESTED_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Read commit description
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.commit_sha }}
        run: git log -1 --format=%B "${HEAD_SHA}" > release-notes.md

      - name: Skip an existing release
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create release from commit description
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          HEAD_SHA: ${{ inputs.commit_sha }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${HEAD_SHA}" \
            --title "${TAG}" \
            --notes-file release-notes.md
